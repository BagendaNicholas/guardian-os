<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianOS - Multi-Device Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./multi-style.css">
</head>
<body class="dashboard-body">

    <div class="background-grid"></div>

    <!-- HEADER -->
    <header class="dashboard-header">
        <div class="brand">
            <i class="fa-solid fa-shield-halved tech-glow"></i>
            <h2>GUARDIAN<span class="accent-text">OS</span> Nixcy</h2>
        </div>
        <div class="system-status-indicator">
            <span class="pulse-dot"></span>
            <span id="connection-status">LINK ESTABLISHED</span>
        </div>
        <button id="btn-logout" class="logout-btn"><i class="fa-solid fa-power-off"></i> DISCONNECT</button>
    </header>

    <div class="dashboard-container">
        <!-- DEVICES SIDEBAR -->
        <aside class="devices-sidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-mobile-screen-button"></i> CONNECTED DEVICES</h3>
