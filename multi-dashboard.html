<!-- REMOTE MEDIA MONITOR -->
                    <section class="crypto-card full-width">
                        <div class="card-header">
                            <h3><i class="fa-solid fa-photo-film"></i> REMOTE MEDIA MONITOR</h3>
                        </div>
                        <div class="card-body image-monitor-layout" style="display: flex; flex-direction: column; height: 400px;">
                            
                            <!-- Media Viewport (Flexbox Centered) -->
                            <div class="viewport-canvas-wrapper" style="position: relative; width: 100%; flex-grow: 1; background: #0a0f14; border: 1px solid #1e293b; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                                
                                <!-- Photo Element -->
                                <img id="cameraPreviewFrame" src="" alt="Live Feed" 
                                     style="display: none; max-width: 100%; max-height: 100%; object-fit: contain; position: relative; z-index: 10;" />
                                
                                <!-- Video Element -->
                                <video id="mediaVideoPlayer" controls playsinline 
                                       style="display: none; max-width: 100%; max-height: 100%; object-fit: contain; position: relative; z-index: 10;"></video>
                                
                                <!-- Audio Element (Centered vertically) -->
                                <div id="audio-container" style="display: none; width: 90%; position: relative; z-index: 10; text-align: center;">
                                    <audio id="mediaAudioPlayer" controls style="width: 100%;"></audio>
                                </div>
                                
                                <!-- Placeholder Text -->
                                <div id="mediaPlaceholderText" style="color: #8a99ad; font-family: 'Rajdhani', sans-serif; font-size: 16px; text-align: center; letter-spacing: 1px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;">
                                    <i class="fa-solid fa-circle-notch fa-spin" style="display: block; font-size: 32px; color: #00E5FF; margin-bottom: 12px;"></i>
                                    AWAITING TERMINAL MEDIA DOWNLINK...
                                </div>
                            </div>
                            
                            <!-- Timestamp Footer -->
                            <div id="captureTimestamp" style="font-family: 'Orbitron', sans-serif; font-size: 11px; color: #00E5FF; text-align: right; letter-spacing: 1px; margin-top: 10px; opacity: 0.8;">
                                LAST UPDATED: NEVER
                            </div>
                        </div>
                    </section>
