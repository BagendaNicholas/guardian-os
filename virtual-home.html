<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>GuardianOS Mansion - Drive & Explore</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; touch-action: none; background: #000; font-family: Arial, sans-serif; }
        
        /* Loading Screen */
        #loading-screen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a1a; color: white; z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 1.2em; transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3);
            border-top-color: #4CAF50; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }

        /* UI Overlay */
        #ui {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10; pointer-events: none; display: none; /* Hidden until loaded */
        }
        #ui > * { pointer-events: auto; }

        #info {
            position: absolute; top: 20px; left: 20px;
            color: white; background: rgba(30,50,60,0.9);
            padding: 15px 20px; border-radius: 12px;
            max-width: 280px; backdrop-filter: blur(5px);
        }
        #info h2 { font-size: 1.3em; margin-bottom: 5px; }
        #info p { font-size: 0.9em; opacity: 0.9; }

        #mode-label {
            position: absolute; top: 80px; left: 50%;
            transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.7);
            padding: 8px 24px; border-radius: 20px;
            font-size: 1.1em; font-weight: bold;
            display: none; text-transform: uppercase;
            letter-spacing: 1px; border: 1px solid rgba(255,255,255,0.2);
        }

        #joystick-zone {
            position: absolute; bottom: 40px; left: 40px;
            width: 140px; height: 140px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
        }
        #joystick-knob {
            position: absolute; width: 50px; height: 50px;
            background: rgba(255,255,255,0.7);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        #look-zone {
            position: absolute; top: 0; right: 0;
            width: 50%; height: 100%;
        }

        .action-btn {
            position: absolute; width: 60px; height: 60px;
            background: rgba(255,255,255,0.25);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%; color: white;
            font-size: 1.5em; display: flex;
            align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        .action-btn:active { background: rgba(255,255,255,0.5); transform: scale(0.95); }
        
        #btn-interact { 
            bottom: 40px; right: 40px; 
            background: rgba(76,175,80,0.4); 
            border-color: rgba(76,175,80,0.7); 
        }
        #btn-reset { bottom: 120px; right: 40px; font-size: 1em; }

        #instructions {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.7);
            padding: 8px 16px; border-radius: 20px;
            font-size: 0.8em; text-align: center;
            white-space: nowrap;
        }

        #speedometer {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            color: #00E676; font-family: 'Courier New', monospace;
            font-size: 2em; font-weight: bold;
            text-shadow: 0 0 10px rgba(0,230,118,0.5);
            display: none;
        }
        #speed-label {
            font-size: 0.4em; color: #aaa; display: block; text-align: center;
        }

        #interact-prompt {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: white; background: rgba(0,0,0,0.85);
            padding: 14px 28px; border-radius: 8px;
            font-size: 1.2em; display: none;
            border: 1px solid rgba(255,255,255,0.3);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        #error-msg {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ff5252; background: rgba(0,0,0,0.9);
            padding: 20px; border-radius: 8px;
            z-index: 10000; display: none;
            text-align: center; max-width: 80%;
        }
    </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
    <div class="spinner"></div>
    <div>Loading GuardianOS Mansion...</div>
    <div style="font-size:0.8em; margin-top:10px; opacity:0.7;">Please wait</div>
</div>

<!-- Error Display -->
<div id="error-msg"></div>

<div id="ui">
    <div id="info">
        <h2>🏡 GuardianOS Mansion</h2>
        <p>Walk, Drive & Explore!</p>
    </div>
    
    <div id="mode-label">LIVING ROOM</div>
    <div id="speedometer">0 <span id="speed-label">KM/H</span></div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="look-zone"></div>
    
    <div class="action-btn" id="btn-interact">🚪</div>
    <div class="action-btn" id="btn-reset">↩️</div>
    
    <div id="instructions">🕹️ Left: Move | Right: Look | 🔘: Interact</div>
    <div id="interact-prompt">Tap to interact!</div>
</div>

<!-- Three.js with fallback -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Fallback if CDN fails
if (typeof THREE === 'undefined') {
    document.getElementById('loading-screen').style.display = 'none';
    var err = document.getElementById('error-msg');
    err.style.display = 'block';
    err.innerHTML = '❌ Failed to load 3D engine.<br>Please check your internet connection and refresh.';
} else {
    // Initialize when DOM is ready
    window.addEventListener('DOMContentLoaded', initGame);
}

function initGame() {
    try {
        "use strict";

        // ===== SCENE SETUP =====
        var scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 10, 150);

        var camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        var renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.insertBefore(renderer.domElement, document.getElementById('ui'));

        // Hide loading screen once renderer is ready
        setTimeout(function() {
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(function() {
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('ui').style.display = 'block';
            }, 500);
        }, 1000);

        // ===== LIGHTING =====
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        var sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024; // Reduced for mobile performance
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 200;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);

        // ===== MATERIALS =====
        var M = {
            grass: new THREE.MeshLambertMaterial({ color: 0x4CAF50 }),
            road: new THREE.MeshLambertMaterial({ color: 0x333333 }),
            wall: new THREE.MeshLambertMaterial({ color: 0xF5F5DC }),
            roof: new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
            door: new THREE.MeshLambertMaterial({ color: 0x654321 }),
            win: new THREE.MeshPhongMaterial({ color: 0xADD8E6, transparent: true, opacity: 0.5, shininess: 100 }),
            fence: new THREE.MeshLambertMaterial({ color: 0xFFFFFF }),
            floorWood: new THREE.MeshLambertMaterial({ color: 0xDEB887 }),
            floorTile: new THREE.MeshLambertMaterial({ color: 0xE0E0E0 }),
            wallInt: new THREE.MeshLambertMaterial({ color: 0xFFFACD }),
            frame: new THREE.MeshLambertMaterial({ color: 0x8B4513 }),
            trunk: new THREE.MeshLambertMaterial({ color: 0x5D4037 }),
            leaf: new THREE.MeshLambertMaterial({ color: 0x2E7D32 }),
            bed: new THREE.MeshLambertMaterial({ color: 0x1565C0 }),
            pillow: new THREE.MeshLambertMaterial({ color: 0xFFFFFF }),
            sofa: new THREE.MeshLambertMaterial({ color: 0x424242 }),
            tv: new THREE.MeshBasicMaterial({ color: 0x000000 }),
            carBody: new THREE.MeshPhongMaterial({ color: 0xD32F2F, shininess: 100 }),
            carGlass: new THREE.MeshPhongMaterial({ color: 0x212121, transparent: true, opacity: 0.7 }),
            wheel: new THREE.MeshLambertMaterial({ color: 0x212121 }),
            poolWater: new THREE.MeshPhongMaterial({ color: 0x0288D1, transparent: true, opacity: 0.7, shininess: 100 }),
            poolEdge: new THREE.MeshLambertMaterial({ color: 0xBDBDBD }),
            headlight: new THREE.MeshBasicMaterial({ color: 0xFFFFE0 })
        };

        // ===== WORLD BUILDING =====
        var ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), M.grass);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        var road = new THREE.Mesh(new THREE.PlaneGeometry(12, 200), M.road);
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, 0.02, 80);
        road.receiveShadow = true;
        scene.add(road);

        function addFence(x, z, w, h) {
            var f = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), M.fence);
            f.position.set(x, h/2, z);
            f.castShadow = true;
            scene.add(f);
        }
        addFence(-30, 50, 40, 2); addFence(30, 50, 40, 2);
        addFence(-50, 30, 2, 40);  addFence(50, 30, 2, 40);
        addFence(-50, -30, 2, 40); addFence(50, -30, 2, 40);
        addFence(-30, -50, 40, 2); addFence(30, -50, 40, 2);

        function makeTree(x, z) {
            var t = new THREE.Group();
            var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 3, 8), M.trunk);
            trunk.position.y = 1.5; trunk.castShadow = true;
            t.add(trunk);
            var leaves = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), M.leaf);
            leaves.position.y = 4; leaves.castShadow = true;
            t.add(leaves);
            t.position.set(x, 0, z);
            return t;
        }
        [[-25,-25],[25,-25],[-40,15],[40,15],[-20,40],[20,40],[-45,-15],[45,-15],[-15,-40],[15,-40]].forEach(function(p) {
            scene.add(makeTree(p[0], p[1]));
        });

        var poolGroup = new THREE.Group();
        var poolWater = new THREE.Mesh(new THREE.BoxGeometry(10, 1.5, 6), M.poolWater);
        poolWater.position.y = -0.75;
        poolGroup.add(poolWater);
        [[0,0.1,3.25,11,0.2,0.5],[0,0.1,-3.25,11,0.2,0.5],[5.25,0.1,0,0.5,0.2,7],[-5.25,0.1,0,0.5,0.2,7]].forEach(function(p) {
            var e = new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]), M.poolEdge);
            e.position.set(p[0],p[1],p[2]);
            poolGroup.add(e);
        });
        poolGroup.position.set(30, 0, -15);
        scene.add(poolGroup);

        // ===== HOUSE =====
        var houseGroup = new THREE.Group();
        var HW = 20, HD = 14, HH = 6;

        var fwL = new THREE.Mesh(new THREE.BoxGeometry(7, HH, 0.5), M.wall);
        fwL.position.set(-6.5, HH/2, HD/2); fwL.castShadow=true; fwL.receiveShadow=true;
        houseGroup.add(fwL);
        var fwR = new THREE.Mesh(new THREE.BoxGeometry(7, HH, 0.5), M.wall);
        fwR.position.set(6.5, HH/2, HD/2); fwR.castShadow=true; fwR.receiveShadow=true;
        houseGroup.add(fwR);
        var fwTop = new THREE.Mesh(new THREE.BoxGeometry(6, 1.5, 0.5), M.wall);
        fwTop.position.set(0, HH-0.75, HD/2); fwTop.castShadow=true;
        houseGroup.add(fwTop);
        var bw = new THREE.Mesh(new THREE.BoxGeometry(HW, HH, 0.5), M.wall);
        bw.position.set(0, HH/2, -HD/2); bw.castShadow=true; bw.receiveShadow=true;
        houseGroup.add(bw);
        var swL = new THREE.Mesh(new THREE.BoxGeometry(0.5, HH, HD), M.wall);
        swL.position.set(-HW/2, HH/2, 0); swL.castShadow=true; swL.receiveShadow=true;
        houseGroup.add(swL);
        var swR = new THREE.Mesh(new THREE.BoxGeometry(0.5, HH, HD), M.wall);
        swR.position.set(HW/2, HH/2, 0); swR.castShadow=true; swR.receiveShadow=true;
        houseGroup.add(swR);

        var roof = new THREE.Mesh(new THREE.ConeGeometry(16, 5, 4), M.roof);
        roof.position.y = HH + 2.5;
        roof.rotation.y = Math.PI / 4;
        roof.castShadow = true;
        houseGroup.add(roof);

        var doorMesh = new THREE.Mesh(new THREE.BoxGeometry(3, 4.5, 0.4), M.door);
        doorMesh.position.set(0, 2.25, HD/2 + 0.1);
        doorMesh.castShadow = true;
        houseGroup.add(doorMesh);

        function makeWindow(x, y, z, ry) {
            var g = new THREE.Group();
            g.add(new THREE.Mesh(new THREE.BoxGeometry(2.5, 2, 0.3), M.win));
            [[0,1.1,0,2.9,0.2,0.4],[0,-1.1,0,2.9,0.2,0.4],[-1.35,0,0,0.2,2.4,0.4],[1.35,0,0,0.2,2.4,0.4]].forEach(function(p) {
                var m = new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]), M.frame);
                m.position.set(p[0],p[1],p[2]);
                g.add(m);
            });
            g.position.set(x,y,z);
            if(ry) g.rotation.y = ry;
            return g;
        }
        houseGroup.add(makeWindow(-6, 3.5, HD/2+0.1, 0));
        houseGroup.add(makeWindow(6, 3.5, HD/2+0.1, 0));
        houseGroup.add(makeWindow(-HW/2-0.1, 3.5, -3, Math.PI/2));
        houseGroup.add(makeWindow(HW/2+0.1, 3.5, -3, Math.PI/2));

        var intFloor = new THREE.Mesh(new THREE.PlaneGeometry(HW-1, HD-1), M.floorWood);
        intFloor.rotation.x = -Math.PI/2;
        intFloor.position.y = 0.01;
        intFloor.receiveShadow = true;
        houseGroup.add(intFloor);

        var garageWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, HH, HD-2), M.wallInt);
        garageWall.position.set(4, HH/2, 0);
        houseGroup.add(garageWall);
        var lrBrWall = new THREE.Mesh(new THREE.BoxGeometry(HW-2, HH, 0.3), M.wallInt);
        lrBrWall.position.set(0, HH/2, -3);
        houseGroup.add(lrBrWall);
        var lrBrDoorTop = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 0.3), M.wallInt);
        lrBrDoorTop.position.set(0, HH-1, -3);
        houseGroup.add(lrBrDoorTop);

        scene.add(houseGroup);

        // ===== FURNITURE =====
        var garageFloor = new THREE.Mesh(new THREE.PlaneGeometry(11, 13), M.floorTile);
        garageFloor.rotation.x = -Math.PI/2;
        garageFloor.position.set(14.5, 0.02, 0);
        houseGroup.add(garageFloor);
        var garageLight = new THREE.PointLight(0xFFEEBB, 0.8, 15);
        garageLight.position.set(14.5, 5, 0);
        houseGroup.add(garageLight);

        var sofa = new THREE.Group();
        sofa.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(4,0.8,2), M.sofa), {position: new THREE.Vector3(0,0.4,0)}));
        sofa.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(4,1.2,0.4), M.sofa), {position: new THREE.Vector3(0,1,-0.8)}));
        sofa.position.set(-5, 0, 3);
        sofa.rotation.y = Math.PI;
        houseGroup.add(sofa);
        var tvStand = new THREE.Mesh(new THREE.BoxGeometry(3,1,1), new THREE.MeshLambertMaterial({color:0x3E2723}));
        tvStand.position.set(-5, 0.5, -2.5); tvStand.castShadow=true;
        houseGroup.add(tvStand);
        var tvScreen = new THREE.Mesh(new THREE.BoxGeometry(2.5,1.5,0.2), M.tv);
        tvScreen.position.set(-5, 1.75, -2.5);
        houseGroup.add(tvScreen);
        var lrLight = new THREE.PointLight(0xFFFFE0, 0.7, 15);
        lrLight.position.set(-5, 5, 0);
        houseGroup.add(lrLight);

        var bed = new THREE.Group();
        bed.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(3,0.6,4), new THREE.MeshLambertMaterial({color:0x5D4037})), {position: new THREE.Vector3(0,0.3,0)}));
        bed.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(2.8,0.4,3.8), M.bed), {position: new THREE.Vector3(0,0.8,0)}));
        bed.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1,0.3,0.6), M.pillow), {position: new THREE.Vector3(-0.7,1.15,-1.5)}));
        bed.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1,0.3,0.6), M.pillow), {position: new THREE.Vector3(0.7,1.15,-1.5)}));
        bed.position.set(-5, 0, -5);
        houseGroup.add(bed);
        var ns = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({color:0x8D6E63}));
        ns.position.set(-2.5, 0.5, -5); ns.castShadow=true;
        houseGroup.add(ns);
        var brLight = new THREE.PointLight(0xFFCCBC, 0.6, 12);
        brLight.position.set(-5, 5, -5);
        houseGroup.add(brLight);

        // ===== DRIVABLE CAR =====
        var carGroup = new THREE.Group();
        var cBody = new THREE.Mesh(new THREE.BoxGeometry(4.5, 1.2, 2.2), M.carBody);
        cBody.position.y = 0.8; cBody.castShadow = true;
        carGroup.add(cBody);
        var cCab = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 2), M.carGlass);
        cCab.position.set(-0.3, 1.85, 0);
        carGroup.add(cCab);
        var hlL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.5), M.headlight);
        hlL.position.set(2.25, 0.8, 0.7);
        carGroup.add(hlL);
        var hlR = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.5), M.headlight);
        hlR.position.set(2.25, 0.8, -0.7);
        carGroup.add(hlR);
        var hlSpotL = new THREE.SpotLight(0xFFFFE0, 2, 40, 0.5, 0.5, 1);
        hlSpotL.position.set(2.3, 0.8, 0.7);
        hlSpotL.target.position.set(10, 0, 0.7);
        carGroup.add(hlSpotL);
        carGroup.add(hlSpotL.target);
        var hlSpotR = new THREE.SpotLight(0xFFFFE0, 2, 40, 0.5, 0.5, 1);
        hlSpotR.position.set(2.3, 0.8, -0.7);
        hlSpotR.target.position.set(10, 0, -0.7);
        carGroup.add(hlSpotR);
        carGroup.add(hlSpotR.target);
        [[-1.4, 0.4, 1.1], [1.4, 0.4, 1.1], [-1.4, 0.4, -1.1], [1.4, 0.4, -1.1]].forEach(function(p) {
            var w = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16), M.wheel);
            w.rotation.z = Math.PI/2;
            w.position.set(p[0], p[1], p[2]);
            carGroup.add(w);
        });
        carGroup.position.set(0, 0, 18);
        scene.add(carGroup);

        // ===== GAME STATE =====
        var mode = 'walking';
        var moveX = 0, moveZ = 0;
        var lookYaw = 0, lookPitch = 0;
        var isInsideHouse = false;
        var currentRoom = '';
        var speed = 8;
        var carSpeed = 0;
        var carMaxSpeed = 25;
        var carAcceleration = 15;
        var carFriction = 8;
        var carMaxSteering = 0.04;
        var walkCamPos = new THREE.Vector3(0, 2, 50);
        var driveCamOffset = new THREE.Vector3(-6, 3, -2);

        // ===== CONTROLS =====
        var joyZone = document.getElementById('joystick-zone');
        var joyKnob = document.getElementById('joystick-knob');
        var joyActive = false;
        var joyCX = 0, joyCY = 0;
        var joyR = 70;

        joyZone.addEventListener('touchstart', function(e) {
            e.preventDefault();
            joyActive = true;
            var r = joyZone.getBoundingClientRect();
            joyCX = r.left + r.width/2;
            joyCY = r.top + r.height/2;
            updateJoy(e.touches[0]);
        }, {passive:false});

        joyZone.addEventListener('touchmove', function(e) {
            e.preventDefault();
            if(joyActive) updateJoy(e.touches[0]);
        }, {passive:false});

        joyZone.addEventListener('touchend', function(e) {
            e.preventDefault();
            joyActive = false;
            moveX = 0; moveZ = 0;
            joyKnob.style.transform = 'translate(-50%,-50%)';
        }, {passive:false});

        function updateJoy(touch) {
            var dx = touch.clientX - joyCX;
            var dy = touch.clientY - joyCY;
            var dist = Math.sqrt(dx*dx + dy*dy);
            if(dist > joyR) { dx=(dx/dist)*joyR; dy=(dy/dist)*joyR; }
            joyKnob.style.transform = 'translate(calc(-50%+'+dx+'px), calc(-50%+'+dy+'px))';
            moveX = dx/joyR;
            moveZ = dy/joyR;
        }

        var lookZone = document.getElementById('look-zone');
        var lastLX = 0, lastLY = 0;
        lookZone.addEventListener('touchstart', function(e) {
            e.preventDefault();
            lastLX = e.touches[0].clientX;
            lastLY = e.touches[0].clientY;
        }, {passive:false});
        lookZone.addEventListener('touchmove', function(e) {
            e.preventDefault();
            var dx = e.touches[0].clientX - lastLX;
            var dy = e.touches[0].clientY - lastLY;
            lookYaw -= dx * 0.005;
            lookPitch -= dy * 0.005;
            lookPitch = Math.max(-Math.PI/2+0.1, Math.min(Math.PI/2-0.1, lookPitch));
            lastLX = e.touches[0].clientX;
            lastLY = e.touches[0].clientY;
        }, {passive:false});

        // ===== INTERACTION =====
        var btnInteract = document.getElementById('btn-interact');
        var interactPrompt = document.getElementById('interact-prompt');
        var modeLabel = document.getElementById('mode-label');
        var speedometer = document.getElementById('speedometer');

        function getInteractionTarget() {
            if(mode === 'walking') {
                if(!isInsideHouse) {
                    var distToDoor = camera.position.distanceTo(new THREE.Vector3(0, 2, HD/2+2));
                    if(distToDoor < 8) return {type:'house', label:'🚪 Enter House'};
                    var distToCar = camera.position.distanceTo(carGroup.position.clone().add(new THREE.Vector3(0,1,0)));
                    if(distToCar < 6) return {type:'car', label:'🚗 Drive Car'};
                } else {
                    var distToDoorIn = camera.position.distanceTo(new THREE.Vector3(0, 2, HD/2+1));
                    if(distToDoorIn < 5) return {type:'exit', label:'🚪 Exit House'};
                }
            } else if(mode === 'driving') {
                return {type:'exit_car', label:' Exit Car'};
            }
            return null;
        }

        function handleInteraction() {
            var target = getInteractionTarget();
            if(!target) return;

            if(target.type === 'house') {
                isInsideHouse = true;
                camera.position.set(0, 2, 4);
                lookYaw = Math.PI;
                lookPitch = 0;
                updateRoomLabel();
            } else if(target.type === 'exit') {
                isInsideHouse = false;
                camera.position.set(0, 2, HD/2+6);
                lookYaw = 0;
                lookPitch = 0;
                modeLabel.style.display = 'none';
            } else if(target.type === 'car') {
                mode = 'driving';
                carSpeed = 0;
                updateDriveCamera();
                modeLabel.textContent = ' DRIVING MODE';
                modeLabel.style.display = 'block';
                modeLabel.style.background = 'rgba(211,47,47,0.8)';
                speedometer.style.display = 'block';
                btnInteract.textContent = '';
                btnInteract.style.background = 'rgba(244,67,54,0.4)';
                btnInteract.style.borderColor = 'rgba(244,67,54,0.7)';
            } else if(target.type === 'exit_car') {
                mode = 'walking';
                isInsideHouse = false;
                var exitPos = carGroup.position.clone();
                exitPos.x += 3;
                exitPos.y = 2;
                camera.position.copy(exitPos);
                lookYaw = 0;
                lookPitch = 0;
                carSpeed = 0;
                modeLabel.style.display = 'none';
                speedometer.style.display = 'none';
                btnInteract.textContent = '🚪';
                btnInteract.style.background = 'rgba(76,175,80,0.4)';
                btnInteract.style.borderColor = 'rgba(76,175,80,0.7)';
            }
        }

        btnInteract.addEventListener('touchstart', function(e) { e.preventDefault(); handleInteraction(); });
        btnInteract.addEventListener('click', handleInteraction);

        document.getElementById('btn-reset').addEventListener('touchstart', function(e) {
            e.preventDefault();
            mode = 'walking';
            isInsideHouse = false;
            camera.position.copy(walkCamPos);
            lookYaw = 0; lookPitch = 0;
            moveX = 0; moveZ = 0;
            carSpeed = 0;
            joyKnob.style.transform = 'translate(-50%,-50%)';
            modeLabel.style.display = 'none';
            speedometer.style.display = 'none';
            btnInteract.textContent = '🚪';
            btnInteract.style.background = 'rgba(76,175,80,0.4)';
            btnInteract.style.borderColor = 'rgba(76,175,80,0.7)';
        });

        function updateRoomLabel() {
            if(!isInsideHouse || mode !== 'walking') {
                modeLabel.style.display = 'none';
                return;
            }
            var x = camera.position.x;
            var z = camera.position.z;
            var newRoom = '';
            if(x > 4) newRoom = '🚗 GARAGE';
            else if(z < -3) newRoom = '🛏️ BEDROOM';
            else newRoom = '🛋️ LIVING ROOM';

            if(newRoom !== currentRoom) {
                currentRoom = newRoom;
                modeLabel.textContent = currentRoom;
                modeLabel.style.display = 'block';
                modeLabel.style.background = 'rgba(0,0,0,0.7)';
                modeLabel.style.opacity = '0';
                setTimeout(function(){ modeLabel.style.transition='opacity 0.3s'; modeLabel.style.opacity='1'; }, 50);
            }
        }

        function updateDriveCamera() {
            var offset = driveCamOffset.clone().applyAxisAngle(new THREE.Vector3(0,1,0), carGroup.rotation.y);
            var targetPos = carGroup.position.clone().add(offset);
            targetPos.y = Math.max(2, targetPos.y);
            camera.position.lerp(targetPos, 0.1);
            var lookAt = carGroup.position.clone();
            lookAt.y = 1.5;
            var forward = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), carGroup.rotation.y);
            lookAt.add(forward.multiplyScalar(10));
            camera.lookAt(lookAt);
            var dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            lookYaw = Math.atan2(-dir.x, -dir.z);
            lookPitch = Math.asin(dir.y);
        }

        // ===== ANIMATION LOOP =====
        var clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            var delta = Math.min(clock.getDelta(), 0.1);

            if(mode === 'walking') {
                if(moveX !== 0 || moveZ !== 0) {
                    var fwd = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                    fwd.y = 0; fwd.normalize();
                    var rt = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
                    rt.y = 0; rt.normalize();
                    camera.position.addScaledVector(fwd, -moveZ * speed * delta);
                    camera.position.addScaledVector(rt, moveX * speed * delta);
                    camera.position.y = 2;
                    camera.position.x = Math.max(-48, Math.min(48, camera.position.x));
                    camera.position.z = Math.max(-48, Math.min(98, camera.position.z));
                }
                var euler = new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);
                updateRoomLabel();
            } else if(mode === 'driving') {
                if(moveZ < -0.1) {
                    carSpeed += carAcceleration * (-moveZ) * delta;
                } else if(moveZ > 0.1) {
                    carSpeed -= carAcceleration * moveZ * delta;
                } else {
                    if(carSpeed > 0) carSpeed = Math.max(0, carSpeed - carFriction * delta);
                    else if(carSpeed < 0) carSpeed = Math.min(0, carSpeed + carFriction * delta);
                }
                carSpeed = Math.max(-carMaxSpeed/2, Math.min(carMaxSpeed, carSpeed));
                if(Math.abs(carSpeed) > 0.5) {
                    var steerAmount = carMaxSteering * moveX * (carSpeed / carMaxSpeed);
                    carGroup.rotation.y += steerAmount;
                }
                var carForward = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0,1,0), carGroup.rotation.y);
                carGroup.position.addScaledVector(carForward, carSpeed * delta);
                carGroup.position.x = Math.max(-45, Math.min(45, carGroup.position.x));
                carGroup.position.z = Math.max(-45, Math.min(95, carGroup.position.z));
                updateDriveCamera();
                var displaySpeed = Math.abs(Math.round(carSpeed * 3.6));
                speedometer.innerHTML = displaySpeed + ' <span id="speed-label">KM/H</span>';
            }

            var target = getInteractionTarget();
            if(target) {
                interactPrompt.textContent = target.label;
                interactPrompt.style.display = 'block';
                btnInteract.style.borderColor = 'rgba(76,175,80,0.9)';
            } else {
                interactPrompt.style.display = 'none';
                btnInteract.style.borderColor = 'rgba(255,255,255,0.4)';
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        camera.position.copy(walkCamPos);
        animate();

    } catch(err) {
        console.error("Game Error:", err);
        document.getElementById('loading-screen').style.display = 'none';
        var errDiv = document.getElementById('error-msg');
        errDiv.style.display = 'block';
        errDiv.innerHTML = '❌ Game Error:<br>' + err.message + '<br><br>Please refresh the page.';
    }
}
</script>
</body>
</html>
